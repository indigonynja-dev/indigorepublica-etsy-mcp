[project]
name = "nynja-etsy-mcp"
version = "1.0.0"
description = "MCP server for managing your own Etsy shop from Claude Code and Claude.ai (Etsy Open API v3)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
nynja-etsy-mcp = "nynja_etsy_mcp.server:main"
nynja-etsy-auth = "nynja_etsy_mcp.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nynja_etsy_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
